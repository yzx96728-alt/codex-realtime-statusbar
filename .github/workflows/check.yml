name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test usage, reminders and chat recognition
        run: ./scripts/test.sh
      - name: Build and verify universal app
        run: ./scripts/package.sh
